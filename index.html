<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Genrator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <h2>Random Password Genrator</h2>
        <input type="text" placeholder="create password" id="password" readonly>
        <table>
            <th><div id="button" class="btn1" onclick="genPassword()">Generate</div></th>
            <th><a id="button" class="btn2" onclick="copyPassword()">Copy</a></th>
        </table>
        
    </div>
    <script src="app.js"></script>
</body>
</html>
